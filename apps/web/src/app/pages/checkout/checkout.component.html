<div class="checkout-container">
  <h2>Confirmar Recarga</h2>

  <form #checkoutForm="ngForm" (ngSubmit)="confirm()" class="checkout-form">
    <!-- Phone number -->
    <div class="form-group">
      <label for="phoneNumber">Número de teléfono</label>
      <input
        type="tel"
        id="phoneNumber"
        name="phoneNumber"
        placeholder="0412-1234567"
        [(ngModel)]="rechargePayload.phoneNumber"
        required
      />
    </div>

    <!-- Operator -->
    <div class="form-group">
      <label for="operator">Operadora</label>
      <select
        id="operator"
        name="operator"
        [(ngModel)]="rechargePayload.operator"
        required
      >
        <option *ngFor="let op of operators" [value]="op">{{ op }}</option>
      </select>
    </div>

    <!-- Amount -->
    <div class="form-group">
      <label for="amount">Monto (Bs.)</label>
      <input
        type="number"
        id="amount"
        name="amount"
        min="1"
        [(ngModel)]="rechargePayload.amount"
        required
      />
    </div>

    <!-- Error message -->
    <p *ngIf="errorMessage" class="error-msg">{{ errorMessage }}</p>

    <!-- Actions -->
    <div class="actions">
      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="!checkoutForm.valid || loading"
      >
        {{ loading ? 'Procesando…' : 'Confirmar Recarga' }}
      </button>
      <a routerLink="/recargar" class="btn btn-secondary">Volver</a>
    </div>
  </form>
</div>
