databases:
  # Native Postgres database on Render (free tier)
  - name: postgres-recarga
    databaseName: recarga_db
    user: recarga_user
    plan: free

services:
  # 1. API Backend (Next.js)
  - type: web
    name: api-recarga
    env: node
    plan: free
    rootDir: .
    buildCommand: npm install && npx prisma generate && npx nx build api
    # Next.js standalone start
    startCommand: cd dist/apps/api && npm install next react react-dom && npx next start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: postgres-recarga
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: MIGRATE_SECRET
        generateValue: true

  # 2. Frontend Angular (Static Site)
  - type: web
    name: web-recarga
    env: static
    plan: free
    rootDir: .
    buildCommand: npm install && npx nx build web --configuration production
    staticPublishPath: ./dist/apps/web/browser
